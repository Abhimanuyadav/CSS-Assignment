<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    
    <style>
        main {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        
        .ludo-board {
            width: 600px;
            height: 600px;
            border: 2px solid #000000;
            display: grid;
            grid-template-columns: 6fr 3fr 6fr;
            grid-template-rows: 6fr 3fr 6fr;
            background-color: #ffffff;
        }

       
        .base {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border: 1px solid #000000;
        }

        .base.red { background-color: #ff0000; }
        .base.green { background-color: #008000; }
        .base.blue { background-color: #0000ff; }
        .base.yellow { background-color: #ffff00; }

        .white-box {
            background-color: #ffffff;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            align-items: center;
            justify-items: center;
            padding: 16px;
        }

        
        .token {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #ffffff;
        }

        .token.red { border: 5px solid #ff0000; }
        .token.green { border: 5px solid #008000; }
        .token.blue { border: 5px solid #0000ff; }
        .token.yellow { border: 5px solid #ffff00; }

        
        .track {
            display: grid;
            background-color: #ffffff;
        }

        .track.vertical {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .track.horizontal {
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        
        .cell {
            border: 1px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #000000;
            user-select: none;
        }

        
        .cell.red { background-color: #ff0000; }
        .cell.green { background-color: #008000; }
        .cell.blue { background-color: #0000ff; }
        .cell.yellow { background-color: #ffff00; }

       
        .center-home {
            width: 100%;
            height: 100%;
            border: 1px solid #000000;
            overflow: hidden;
        }

        .center-home svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="ludo-board">

       
        <div class="base red">
            <div class="white-box">
                <div class="token red"></div>
                <div class="token red"></div>
                <div class="token red"></div>
                <div class="token red"></div>
            </div>
        </div>

        
        <div class="track vertical">
         
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
           
            <div class="cell"></div>
            <div class="cell green"></div>
            <div class="cell green">&#9733;</div>
            
            <div class="cell green">&#9733;</div>
            <div class="cell green"></div>
            <div class="cell"></div>
            <
            <div class="cell"></div>
            <div class="cell green"></div>
            <div class="cell"></div>
           
            <div class="cell"></div>
            <div class="cell green"></div>
            <div class="cell"></div>
            
            <div class="cell"></div>
            <div class="cell green"></div>
            <div class="cell"></div>
        </div>

       
        <div class="base green">
            <div class="white-box">
                <div class="token green"></div>
                <div class="token green"></div>
                <div class="token green"></div>
                <div class="token green"></div>
            </div>
        </div>

        
        <div class="track horizontal">
           
            <div class="cell"></div>
            <div class="cell red">&#9733;</div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
           
            <div class="cell"></div>
            <div class="cell red"></div>
            <div class="cell red"></div>
            <div class="cell red"></div>
            <div class="cell red"></div>
            <div class="cell red"></div>
            
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell red">&#9733;</div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>

        
        <div class="center-home">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                
                <polygon points="0,0 100,0 50,50" fill="#008000" />
                
                <polygon points="100,0 100,100 50,50" fill="#ffff00" />
                
                <polygon points="100,100 0,100 50,50" fill="#0000ff" />
                
                <polygon points="0,100 0,0 50,50" fill="#ff0000" />
            </svg>
        </div>

        <div class="track horizontal">
           
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell yellow">&#9733;</div>
            <div class="cell"></div>
            <div class="cell"></div>
           
            <div class="cell yellow"></div>
            <div class="cell yellow"></div>
            <div class="cell yellow"></div>
            <div class="cell yellow"></div>
            <div class="cell yellow"></div>
            <div class="cell"></div>
            
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell yellow">&#9733;</div>
            <div class="cell"></div>
        </div>

        <div class="base blue">
            <div class="white-box">
                <div class="token blue"></div>
                <div class="token blue"></div>
                <div class="token blue"></div>
                <div class="token blue"></div>
            </div>
        </div>

        
        <div class="track vertical">

            <div class="cell"></div>
            <div class="cell blue"></div>
            <div class="cell"></div>
            
            <div class="cell"></div>
            <div class="cell blue"></div>
            <div class="cell"></div>
           
            <div class="cell"></div>
            <div class="cell blue"></div>
            <div class="cell"></div>
           
            <div class="cell"></div>
            <div class="cell blue"></div>
            <div class="cell blue">&#9733;</div>
            
            <div class="cell blue">&#9733;</div>
            <div class="cell blue"></div>
            <div class="cell"></div>
            
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>

        <div class="base yellow">
            <div class="white-box">
                <div class="token yellow"></div>
                <div class="token yellow"></div>
                <div class="token yellow"></div>
                <div class="token yellow"></div>
            </div>
        </div>

    </div>

</body>
</html>
